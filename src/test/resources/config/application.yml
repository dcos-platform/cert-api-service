# Test overrides. Spring Boot loads classpath:/config/application.yml in addition to the main
# classpath:/application.yml and gives it precedence, so only test-specific values live here.
#
# Every test that touches the database uses the dedicated cert_api_test database on an external
# PostgreSQL instance, never the application's shared database. Create it with
# scripts/setup-test-db.sh (or scripts\setup-test-db.bat on Windows).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/cert_api_test
    username: ${DB_USER:dcos}
    password: ${DB_PASSWORD:changeme}
  flyway:
    # Allow clean operations in tests so we can reset the schema between test runs.
    cleanDisabled: false
  task:
    scheduling:
      # Disable scheduled tasks in tests to prevent interference with test data.
      enabled: false
  rabbitmq:
    listener:
      simple:
        # Applies to Boot's auto-configured container factory only. Kept so that any listener
        # added later without a custom factory is also held back.
        auto-startup: false

# Holds the completion listener back in every test context. This is the setting that actually
# governs it: the listener uses a custom container factory, which Boot's
# spring.rabbitmq.listener.simple.auto-startup does not reach.
#
# It matters because a test class that declares @MockBean gets its own Spring context, and every
# cached context would otherwise attach its own consumer to the shared completions queue --
# including contexts whose CertificateRepository is a Mockito mock. RabbitMQ round-robins between
# consumers, so a completion could be delivered to a mocked listener, which reports the
# certificate as absent and discards it while the publishing test waits for a change that never
# comes. The two test classes that genuinely exercise the listener start the container themselves.
cert-api:
  rabbitmq:
    completion-listener-auto-startup: false
