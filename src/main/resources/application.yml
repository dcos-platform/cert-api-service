spring:
  # Shared database provided by dcos-infra; variable names and local defaults match its .env.example.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:dcos}
    username: ${POSTGRES_USER:dcos}
    password: ${POSTGRES_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  flyway:
    schemas: dcos_certificates
    default-schema: dcos_certificates
  jpa:
    hibernate:
      # Refuse to start if any entity disagrees with the migrated schema.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: dcos_certificates
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    # Shared broker provided by dcos-infra; variable names and defaults match its .env.example.
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:dcos}
    password: ${RABBITMQ_PASSWORD:changeme}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        acknowledge-mode: auto

cert-api:
  expiry-sweep-interval: 300000
  metrics:
    refresh-interval: 60000
  outbox:
    relay-interval: 5000
    relay-batch-size: 10
    relay-max-attempts: 3
  orchestration:
    pending-timeout: PT2M
    sweep-interval-ms: 60000
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:cert.events}
    dlx: ${RABBITMQ_DLX:cert.api.dlx}
    dlq: ${RABBITMQ_DLQ:cert.api.dlq}
    orchestrator-queue: ${RABBITMQ_ORCHESTRATOR_QUEUE:certificate.lifecycle.events}
    admin-queue: ${RABBITMQ_ADMIN_QUEUE:cert.lifecycle.events}
    completions-queue: ${RABBITMQ_COMPLETIONS_QUEUE:certificate.lifecycle.completions}
    binding-pattern: ${RABBITMQ_BINDING_PATTERN:cert.#}
    dlq-pattern: ${RABBITMQ_DLQ_PATTERN:#}
    routing-key:
      created: cert.created
      renewed: cert.renewed
      revoked: cert.revoked
      expired: cert.expired

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: cert-api-service

logging:
  level:
    com.dcos.platform.certapi: INFO
