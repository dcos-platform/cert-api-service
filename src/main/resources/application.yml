spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/certdb}
    username: ${DB_USERNAME:certuser}
    password: ${DB_PASSWORD:certpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

cert-api:
  rabbitmq:
    exchange: cert.events
    routing-key:
      created: cert.created
      renewed: cert.renewed
      revoked: cert.revoked

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.dcos.platform.certapi: INFO
