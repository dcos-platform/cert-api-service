name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'cert-api-[0-9]*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    # Integration tests run against real PostgreSQL. Name, user, and password match the test
    # configuration's defaults (src/test/resources/config/application.yml); the health check
    # makes the job wait for readiness before any step runs.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cert_api_test
          POSTGRES_USER: dcos
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dcos -d cert_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: dcos
          RABBITMQ_DEFAULT_PASS: changeme
          RABBITMQ_DEFAULT_VHOST: /
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Cache SonarQube scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonarqube-cache-${{ runner.os }}
          restore-keys: sonarqube-cache-${{ runner.os }}
      - name: Clean verify
        run: ./mvnw clean verify
      - name: SonarQube analysis
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: ./mvnw sonar:sonar -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Verify POM version matches the tag
        if: startsWith(github.ref, 'refs/tags/cert-api-')
        shell: bash
        run: |
          POM=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          TAG="${GITHUB_REF_NAME#cert-api-}"
          echo "POM=$POM TAG=$TAG"
          [ "$POM" = "$TAG" ] || { echo "::error::POM version $POM does not match tag $TAG"; exit 1; }
      - name: Compute image tags
        id: imgtags
        shell: bash
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/cert-api-service"
          {
            echo "list<<EOF"
            echo "$IMG:${{ github.sha }}"
            if [[ "$GITHUB_REF" == refs/tags/cert-api-* ]]; then
              echo "$IMG:${GITHUB_REF_NAME#cert-api-}"
              echo "$IMG:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/cert-api-* ]]; then
            echo "version=${GITHUB_REF_NAME#cert-api-}" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 30
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/cert-api-'))
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/cert-api-')) }}
          tags: ${{ steps.imgtags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_COMMIT_SHA=${{ github.sha }}
            BUILD_VERSION=${{ steps.imgtags.outputs.version || github.sha }}
